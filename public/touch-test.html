<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="タッチ検証" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="robots" content="noindex" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="stylesheet" href="touch-test.css" />
    <title>タッチ検証</title>
  </head>
  <body>
    <main class="test-shell">
      <header class="info-strip">
        <p class="status" data-testid="status" aria-live="polite">
          ホームポジションに4本の指を置いてください（順番でもOK）
        </p>
        <p class="contact-count" aria-label="接触数">
          <span id="pointer-count">P 0</span><span id="touch-count">T 0</span>
        </p>
        <div class="controls" aria-label="操作">
          <div class="hand-switch" aria-label="手を選ぶ">
            <button type="button" class="hand-button selected" data-hand="left">左手</button>
            <button type="button" class="hand-button" data-hand="right">右手</button>
          </div>
          <button type="button" class="action-button" id="reset-button">リセット</button>
          <button type="button" class="action-button result-button" id="result-button">結果を表示</button>
        </div>
      </header>

      <section class="touch-surface" id="touch-surface" aria-label="4点タッチ検証エリア">
        <div class="keyboard" id="keyboard" aria-hidden="true"></div>
        <p class="surface-hint">キー以外への接触も記録します</p>
      </section>
    </main>

    <aside class="portrait-guide" aria-live="polite">
      <p>横向きにしてください</p>
    </aside>

    <section class="result-dialog" id="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="result-card">
        <div class="result-header">
          <h1 id="result-title">タッチ検証の結果</h1>
          <button type="button" class="dialog-button" id="close-button">閉じる</button>
        </div>
        <ul class="test-guide">
          <li>① 4本を同時に置く</li>
          <li>② 順番に置く</li>
          <li>③ 手のひら・親指も触れた状態で置く</li>
        </ul>
        <pre class="result-text" data-testid="result" tabindex="0"></pre>
        <textarea class="copy-fallback" id="copy-fallback" aria-label="コピー用の結果" readonly hidden></textarea>
        <div class="result-footer">
          <p id="copy-message" aria-live="polite"></p>
          <button type="button" class="dialog-button copy-button" id="copy-button">コピー</button>
        </div>
      </div>
    </section>

    <script src="touch-test.js" defer></script>
  </body>
</html>
